name: resto_admin_web
description: "لوحة تحكم وإدارة عمليات مطعم ريستو - مخصصة للويب"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Core shared package
  resto_core:
    path: ../resto_core

  # State Management & Routing
  flutter_bloc: ^8.1.6
  go_router: ^18.0.0
  equatable: ^2.1.0

  # UI & Fonts
  google_fonts: ^8.2.1
  intl: ^0.20.3
  uuid: ^4.6.0
  otp: ^3.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
resolution: workspace
