name: resto_core
description: Core shared models, theme, API and widgets for Resto applications.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.17
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  uuid: ^4.6.0
  shimmer: ^4.0.0
  cached_network_image: ^4.0.0
  otp: ^3.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/images/
    - assets/translations/
resolution: workspace
