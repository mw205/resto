name: resto_landing_page
description: "الموقع التعريفي الرسمي لتطبيق ريستو - حمل التطبيق واطلب الآن"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  resto_core:
    path: ../resto_core

  google_fonts: ^8.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/screenshots/
resolution: workspace
