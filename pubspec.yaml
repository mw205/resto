name: resto
description: "تطبيق ريستو للمطاعم والمأكولات المصرية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.1.0

  # Serialization & Immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Localization & Routing
  easy_localization: ^3.0.8
  go_router: ^18.0.0

  # Service Locator & DI
  get_it: ^9.2.1

  # Networking & Storage
  dio: ^5.11.0
  shared_preferences: ^2.5.5

  # UI, Fonts & Effects
  shimmer: ^4.0.0
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.0
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.10.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.5

flutter_gen:
  output: lib/core/constants/generated/
  line_length: 120

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/images/food/
