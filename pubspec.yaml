name: resto_monorepo
description: "ريستو - Monorepo for Resto Mobile App, Admin Operations Web Dashboard, and Landing Page"
publish_to: 'none'

environment:
  sdk: ^3.13.2

workspace:
  - packages/resto_core
  - packages/resto_app
  - packages/resto_admin_web
  - packages/resto_landing_page

dev_dependencies:
  melos: ^8.6.0

melos:
  command:
    bootstrap:
      runPubGetInParallel: false
  scripts:
    analyze:
      exec: /Users/mw205/development/flutter/bin/flutter analyze
      description: Run flutter analyze across all packages
    test:
      exec: /Users/mw205/development/flutter/bin/flutter test
      packageFilters:
        dirExists: test
      order: serial
      description: Run tests sequentially across packages
