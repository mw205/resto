name: resto_monorepo
description: "ريستو - Monorepo for Resto Mobile App, Admin Operations Web Dashboard, and Landing Page"
publish_to: 'none'

environment:
  sdk: ^3.13.2

workspace:
  - packages/resto_core
  - packages/resto_app
  - packages/resto_admin_web
  - packages/resto_landing_page

dev_dependencies:
  melos: ^8.6.0

melos:
  command:
    bootstrap:
      runPubGetInParallel: false
  scripts:
    analyze:
      exec: flutter analyze
      description: Run flutter analyze across all packages
    test:
      exec: flutter test
      packageFilters:
        dirExists: test
      order: serial
      description: Run tests sequentially across packages
    clean:
      exec: flutter clean
      description: Clean all packages
    build:landing:
      run: cd packages/resto_landing_page && flutter build web --release
      description: Build production release bundle for the Landing Page
    build:admin:
      run: cd packages/resto_admin_web && flutter build web --release
      description: Build production release bundle for the Admin Dashboard
    build:web:
      run: melos run build:landing && melos run build:admin
      description: Build production release bundles for both Web targets
    deploy:landing:
      run: cd packages/resto_landing_page/build/web && vercel --prod
      description: Deploy Landing Page to Vercel production
    deploy:admin:
      run: cd packages/resto_admin_web/build/web && vercel --prod
      description: Deploy Admin Dashboard to Vercel production
    deploy:web:
      run: melos run deploy:landing && melos run deploy:admin
      description: Deploy both Landing Page and Admin Dashboard to Vercel production
